<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#191919" />
    <title>Xiamen &amp; Ningbo Weather</title>
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <main class="widget" aria-label="Current weather in Xiamen and Ningbo">
      <div class="weather-stack">
        <section class="weather" data-weather="xiamen" aria-live="polite" aria-busy="true">
          <div class="place" aria-hidden="true">
            <p class="city">XIAMEN</p>
            <p class="label">WEATHER</p>
          </div>

          <div class="weather-icon" data-weather-icon aria-hidden="true"></div>

          <div class="conditions">
            <p class="temperature"><span data-temperature>--</span> ºC</p>
            <p class="description" data-description>loading weather</p>
          </div>
          <p class="sr-only" data-status>Loading current weather for Xiamen.</p>
        </section>

        <section class="weather" data-weather="ningbo" aria-live="polite" aria-busy="true">
          <div class="place" aria-hidden="true">
            <p class="city">NINGBO</p>
            <p class="label">WEATHER</p>
          </div>

          <div class="weather-icon" data-weather-icon aria-hidden="true"></div>

          <div class="conditions">
            <p class="temperature"><span data-temperature>--</span> ºC</p>
            <p class="description" data-description>loading weather</p>
          </div>
          <p class="sr-only" data-status>Loading current weather for Ningbo.</p>
        </section>
      </div>
    </main>

    <script src="./app.js?v=8" defer></script>
  </body>
</html>
