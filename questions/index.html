<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <title>留一个问题 · 问题盲盒</title>
  <link rel="stylesheet" href="./styles.css?v=8" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-config.js?v=4" defer></script>
  <script src="./questions.js?v=4" defer></script>
  <script src="./cloud.js?v=6" defer></script>
  <script src="./presentation.js?v=6" defer></script>
  <script src="./app.js?v=8" defer></script>
</head>
<body>
  <main class="widget">
    <header class="toolbar">
      <span class="wordmark"><span class="small-star" aria-hidden="true">✳</span><span id="widget-name">留一个问题</span></span>
      <div class="mode-switch"><button id="mode-toggle" type="button" role="switch" aria-label="盲盒模式" aria-checked="true"><span class="toggle-thumb" aria-hidden="true"></span><span class="mode-option">卡片</span><span class="mode-option">盲盒</span></button></div>
    </header>
    <section class="card-scene" aria-label="问题盲盒" aria-busy="false">
      <div class="card" id="card">
        <div class="card-face card-front" id="card-front">
          <div class="card-top"><span id="front-top">一段对话的开始</span><span class="card-mark" aria-hidden="true">↗</span></div>
          <div class="card-content invitation" id="invitation-content">
            <div class="paper-symbol" aria-hidden="true"><span class="paper-card paper-card-back"></span><span class="paper-card paper-card-middle"></span><span class="paper-card paper-card-front">?</span></div>
            <div class="box-symbol" aria-hidden="true"><svg viewBox="0 0 120 116" fill="none"><path class="box-lid" d="M24 40 60 22 96 40 60 58Z"/><path d="M24 47 60 65 96 47V83L60 102 24 83Z"/><path d="M60 65V102M42 56 78 38M22 19v10m-5-5h10M96 9v12m-6-6h12M106 65v8m-4-4h8"/></svg></div>
            <h1 id="invitation-title">留一点好奇，打开聊聊。</h1>
          </div>
          <div class="card-bottom"><span id="front-bottom">给彼此一点思考的时间</span></div>
        </div>
        <div class="card-face card-back" id="card-back" aria-hidden="true">
          <div class="card-top"><span id="back-top">留给此刻的问题</span><span class="card-mark" aria-hidden="true">↗</span></div>
          <div class="card-content question" id="question-content"><span class="question-quote" aria-hidden="true">“</span><span class="preview-label" id="preview-label" hidden>示例问题</span><h1 id="question-text" aria-live="polite"></h1></div>
          <div class="card-bottom"><span id="card-note">听听彼此的答案</span></div>
        </div>
      </div>
      <button class="card-action" id="card-action" type="button" aria-label="打开这个盲盒"></button>
      <a class="manage-icon" id="manage-questions" href="./dashboard.html" target="_blank" rel="noopener noreferrer" aria-label="在新标签页添加问题" title="添加问题"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 3v18M11 12h5m-2.5-2.5v5"/></svg></a>
    </section>
    <p class="sync-status" id="sync-status" role="status" hidden></p>
    <p class="storage-note" id="storage-note" role="status" hidden></p>
    <noscript>请启用 JavaScript 后抽取问题。</noscript>
  </main>
</body>
</html>
