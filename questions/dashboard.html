<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <title>管理问题 · 留一个问题</title>
  <link rel="stylesheet" href="./styles.css?v=9" />
  <link rel="stylesheet" href="./dashboard.css?v=16" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-config.js?v=4" defer></script>
  <script src="./questions.js?v=4" defer></script>
  <script src="./cloud.js?v=15" defer></script>
  <script src="./presentation.js?v=10" defer></script>
  <script src="./dashboard.js?v=16" defer></script>
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header"><a class="wordmark" id="widget-link" href="./" target="_blank" rel="noopener noreferrer"><span class="small-star" aria-hidden="true">✳</span> 留一个问题 ↗</a><span class="connection" id="connection">本地题库</span></header>
    <section class="dashboard-intro"><p class="eyebrow">QUESTION LIBRARY</p><h1>问题库</h1></section>
    <section class="workspace" id="preview-workspace">
      <div class="preview-panel">
        <iframe id="widget-preview" title="问题主页预览" src="about:blank" referrerpolicy="no-referrer"></iframe>
      </div>
      <section class="add-panel question-row"><div class="add-heading"><h2>添加问题</h2><select id="new-topic" aria-label="新问题主题"><option value="">未分类</option><option value="__new__">＋ 新建主题</option></select></div><label class="sr-only" for="new-questions">新问题</label><textarea id="new-questions" rows="2" placeholder="写下一个想一起聊的问题…" maxlength="250500"></textarea><datalist id="topic-options"></datalist><div class="add-actions"><button class="text-button" id="import-local" type="button" hidden>导入本地题库</button><button class="primary" id="add" type="button">添加问题</button></div></section>
    </section>
    <div class="dashboard-toolbar"><span id="question-count"></span><select id="dashboard-topic" class="topic-input" aria-label="按主题查看"><option value="">全部主题</option></select><button class="primary" id="open-batch" type="button">批量添加问题</button><button class="text-button" id="retry" type="button" hidden>重试</button></div>
    <p class="dashboard-status" id="status" role="status"></p>
    <section id="question-rows" class="question-rows" aria-label="问题列表"></section>
  </main>
  <dialog id="topic-dialog" class="topic-dialog"><h2>新建主题</h2><input id="topic-name" aria-label="主题名称" placeholder="主题名称" maxlength="30"><p id="topic-error" role="status"></p><div><button id="cancel-topic" type="button" class="text-button">取消</button><button id="create-topic" type="button" class="primary">确定</button></div></dialog>
  <dialog id="batch-dialog" class="batch-dialog" aria-labelledby="batch-title"><div class="batch-heading"><h2 id="batch-title">批量添加问题</h2><button id="close-batch" type="button" aria-label="关闭批量添加">×</button></div><ul id="batch-existing" class="batch-existing" aria-label="问题列表"></ul><input id="batch-input" type="hidden" /><p id="batch-status" role="status"></p><button id="batch-retry" class="text-button" type="button" hidden>重试</button><button id="submit-batch" type="button" class="primary">更新题库</button></dialog>
</body>
</html>
