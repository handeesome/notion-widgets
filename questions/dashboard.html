<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="referrer" content="no-referrer" />
  <title>管理问题 · 留一个问题</title>
  <link rel="stylesheet" href="./styles.css?v=9" />
  <link rel="stylesheet" href="./dashboard.css?v=11" />
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="./supabase-config.js?v=4" defer></script>
  <script src="./questions.js?v=4" defer></script>
  <script src="./cloud.js?v=10" defer></script>
  <script src="./presentation.js?v=10" defer></script>
  <script src="./dashboard.js?v=11" defer></script>
</head>
<body>
  <main class="dashboard">
    <header class="dashboard-header"><a class="wordmark" id="widget-link" href="./" target="_blank" rel="noopener noreferrer"><span class="small-star" aria-hidden="true">✳</span> 留一个问题 ↗</a><span class="connection" id="connection">本地题库</span></header>
    <section class="dashboard-intro"><p class="eyebrow">QUESTION LIBRARY</p><h1>问题库</h1></section>
    <section class="workspace" id="preview-workspace">
      <div class="preview-panel">
        <iframe id="widget-preview" title="问题主页预览" src="about:blank" referrerpolicy="no-referrer"></iframe>
      </div>
      <section class="add-panel question-row"><h2>添加问题</h2><label class="sr-only" for="new-questions">新问题</label><textarea id="new-questions" rows="2" placeholder="写下一个想一起聊的问题…" maxlength="250500"></textarea><div class="add-actions"><button class="text-button" id="import-local" type="button" hidden>导入本地题库</button><button class="primary" id="add" type="button">添加问题</button></div></section>
    </section>
    <div class="dashboard-toolbar"><span id="question-count"></span><button class="text-button" id="open-batch" type="button">批量添加问题</button><button class="text-button" id="retry" type="button" hidden>重试</button></div>
    <p class="dashboard-status" id="status" role="status"></p>
    <section id="question-rows" class="question-rows" aria-label="问题列表"></section>
  </main>
  <dialog id="batch-dialog" class="batch-dialog" aria-labelledby="batch-title"><div class="batch-heading"><h2 id="batch-title">批量添加问题</h2><button id="close-batch" type="button" aria-label="关闭批量添加">×</button></div><h3>已有问题</h3><ul id="batch-existing" class="batch-existing"></ul><label for="batch-input">新问题</label><textarea id="batch-input" rows="6" placeholder="每行一个问题" maxlength="250500"></textarea><p id="batch-status" role="status"></p><button id="submit-batch" type="button" class="primary">添加到题库</button></dialog>
</body>
</html>
